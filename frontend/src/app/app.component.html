<!-- Hamburger button -->
<button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Full-screen video stream -->
<div #videoContainer class="video-container"></div>

<!-- Menu -->
<app-menu
  [open]="menuOpen"
  (openConfigs)="openConfigs()"
  (close)="closeMenu()"
/>

<!-- Config modal -->
<app-config-modal
  [open]="configModalOpen"
  (close)="closeConfigModal()"
/>
